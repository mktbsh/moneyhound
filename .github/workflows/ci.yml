name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check
        run: bun run check

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

  formal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Property tests
        run: bun test packages/core/src/invariants

      # elan lives in ~/.elan. Lake build output is verification/lean/.lake.
      # The key changes only when the toolchain, the Lake manifest, or the lakefile changes.
      # This job only restores. save-lean-cache saves on push to main.
      - name: Restore Lean toolchain and Lake build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json', 'verification/lean/lakefile.toml') }}

      - name: Lean proofs
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: verification/lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

  # Permissions cannot depend on the event, so the actions: write token is a
  # separate job that does not run on pull requests. It rebuilds only when main
  # has no cache for this key, then saves the same paths formal restores.
  save-lean-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: formal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Lean toolchain and Lake build
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json', 'verification/lean/lakefile.toml') }}
          lookup-only: 'true'

      - name: Build Lean cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: verification/lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Save Lean toolchain and Lake build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
